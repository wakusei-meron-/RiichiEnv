[package]
name = "riichienv-calc-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "WASM bindings for the strict RiichiEnv calculation core"
repository = "https://github.com/wakusei-meron-/RiichiEnv"

[lib]
crate-type = ["cdylib"]

[dependencies]
riichienv-calc = { path = "../riichienv-calc" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
