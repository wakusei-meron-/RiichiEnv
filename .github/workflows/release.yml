name: Build calculation release artifacts

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: jetli/wasm-pack-action@v0.4.0

      - name: Install Python build tool
        run: python -m pip install maturin

      - name: Embed and validate source provenance
        run: |
          printf '%s\n' "${GITHUB_SHA}" > riichienv-calc/SOURCE_GIT_SHA
          test "$(wc -c < riichienv-calc/SOURCE_GIT_SHA)" -eq 41
          grep -Eq '^[0-9a-f]{40}$' riichienv-calc/SOURCE_GIT_SHA

      - name: Test strict core
        run: cargo test -p riichienv-calc --all-features

      - name: Build wheel and source distribution
        run: |
          maturin build --release --out dist
          maturin sdist --out dist
          tar -tzf dist/*.tar.gz | grep -q 'riichienv-calc/SOURCE_GIT_SHA'
          tar -xOf dist/*.tar.gz --wildcards '*/riichienv-calc/SOURCE_GIT_SHA' | grep -Fx "${GITHUB_SHA}"

      - name: Build installable browser and Node WASM packages
        run: |
          wasm-pack build riichienv-calc-wasm --target web --out-dir ../dist/riichienv-calc-wasm-web
          wasm-pack build riichienv-calc-wasm --target nodejs --out-dir ../dist/riichienv-calc-wasm-node
          npm pkg set name=@wakusei-meron/riichi-calc-web --prefix dist/riichienv-calc-wasm-web
          npm pkg set name=@wakusei-meron/riichi-calc-node --prefix dist/riichienv-calc-wasm-node
          npm pack --pack-destination dist --prefix dist/riichienv-calc-wasm-web
          npm pack --pack-destination dist --prefix dist/riichienv-calc-wasm-node
          npm install --no-save ./dist/wakusei-meron-riichi-calc-node-*.tgz
          node tests/wasm/calc_m0_node.mjs node_modules/@wakusei-meron/riichi-calc-node

      - name: Build provenance manifest
        run: |
          cp fixtures/calc-m0-v1.json dist/calc-m0-v1.json
          cp riichienv-calc/SOURCE_GIT_SHA dist/SOURCE_GIT_SHA
          (cd dist && sha256sum * | sort > SHA256SUMS)
          test -s dist/SHA256SUMS

      - name: Upload only immutable GitHub Release artifacts
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
